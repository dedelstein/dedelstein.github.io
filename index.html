<!DOCTYPE html>
<html lang="en" data-scroll-direction="none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Collective - Progressive Font Layering</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400..700&family=Newsreader:opsz,wght@6..72,200..800&family=Playfair+Display:wght@400..900&family=Roboto+Flex:wght@400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Defining our font cycle */
            --font-1: 'Roboto Flex', sans-serif;
            --font-2: 'Lora', serif;
            --font-3: 'Newsreader', serif;
            --font-4: 'Playfair Display', serif;
            --font-ui: 'Roboto Flex', sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: var(--font-ui);
            transition: 
                cursor 0.1s,
                background-color 0.8s ease;
        }

        .content-container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }
        
        /* Wrapper to stack the text elements */
        .main-text-wrapper {
            position: relative;
            height: 6rem;
        }

        .main-text {
            font-size: 5rem;
            margin: 0;
            transition: 
                transform 0.2s ease-out,
                letter-spacing 0.2s ease-out,
                color 0.8s ease,
                opacity 0.4s ease-in-out;
            color: #e0e0e0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }
        
        #main-text-1 { font-family: var(--font-1); opacity: 1; }
        #main-text-2 { font-family: var(--font-2); opacity: 0; }
        #main-text-3 { font-family: var(--font-3); opacity: 0; }
        #main-text-4 { font-family: var(--font-4); opacity: 0; }

        .sub-text {
            margin-top: 1rem;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            color: #888;
            transition: opacity 0.5s ease;
        }

        /* --- 8-WAY DIRECTIONAL COLOR STYLES --- */
        html[data-scroll-direction="up"] body { background-color: #1a222c; }
        html[data-scroll-direction="up"] .main-text { color: #a7c7e7; }
        html[data-scroll-direction="down"] body { background-color: #2c1a2a; }
        html[data-scroll-direction="down"] .main-text { color: #f2a2e8; }
        html[data-scroll-direction="left"] body { background-color: #1e2b1e; }
        html[data-scroll-direction="left"] .main-text { color: #98fb98; }
        html[data-scroll-direction="right"] body { background-color: #2c291a; }
        html[data-scroll-direction="right"] .main-text { color: #f8de7e; }
        html[data-scroll-direction="up-left"] body { background-color: #332411; }
        html[data-scroll-direction="up-left"] .main-text { color: #ffb347; }
        html[data-scroll-direction="up-right"] body { background-color: #231f2b; }
        html[data-scroll-direction="up-right"] .main-text { color: #b19cd9; }
        html[data-scroll-direction="down-left"] body { background-color: #331513; }
        html[data-scroll-direction="down-left"] .main-text { color: #ff6961; }
        html[data-scroll-direction="down-right"] body { background-color: #172b17; }
        html[data-scroll-direction="down-right"] .main-text { color: #77dd77; }

        /* --- NAVIGATION BUTTONS STYLES --- */
        .nav-button {
            position: fixed;
            font-family: var(--font-ui);
            font-size: 1.1rem;
            color: #ccc;
            text-decoration: none;
            padding: 0.8rem 1.2rem;
            background-color: rgba(95, 95, 95, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            transition: color 0.3s ease, letter-spacing 0.3s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            letter-spacing: 1px;
            z-index: 10;
        }

        .nav-button:hover {
            color: #fff;
            letter-spacing: 2px;
        }
        
        /* Set initial off-screen positions with 20% overlap */
        #nav-past-works { top: 50%; left: 0; transform-origin: left center; transform: translateY(-50%) rotate(-90deg) translateY(-10%); }
        #nav-press { top: 50%; right: 0; transform-origin: right center; transform: translateY(-50%) rotate(90deg) translateY(-10%); }

        #nav-publications { top: 0; left: 50%; transform: translateX(-50%) translateY(-60%); }
        #nav-members { bottom: 20px; right: 0; transform: translateX(80%); }
        #nav-writing { bottom: 20px; left: 0; transform: translateX(-60%); }
        #nav-manifesto { top: 20px; left: 0; transform: translateX(-60%); }
        #nav-socials { bottom: 0; left: 50%; transform: translateX(-50%) translateY(60%); }
        #nav-contact { top: 20px; right: 0; transform: translateX(60%); }

        html.revealed-left #nav-past-works,
        html.revealed-up-left #nav-past-works,
        html.revealed-down-left #nav-past-works {
            transform: translateY(-50%) rotate(-90deg) translateY(100%);
        }

        html.revealed-right #nav-press,
        html.revealed-up-right #nav-press,
        html.revealed-down-right #nav-press {
            transform: translateY(-50%) rotate(90deg) translateY(100%);
        }

        html.revealed-up-left #nav-manifesto { transform: translateX(20px); }
        html.revealed-down-left #nav-writing { transform: translateX(20px); }
        html.revealed-down-right #nav-members { transform: translateX(-20px); }
        html.revealed-up-right #nav-contact { transform: translateX(-20px); }
        html.revealed-down #nav-socials { transform: translateX(-50%) translateY(-100%)}
        html.revealed-up #nav-publications { transform: translateX(-50%) translateY(100%)}
        
        @media (max-width: 768px) {
            .content-container {
                width: 100%;
                box-sizing: border-box;
            }
            .main-text-wrapper {
                position: relative;
                display: grid;
                align-items: center;
                justify-items: center;
                height: auto;
                min-height: 8rem;
                max-height: 16rem; /* Prevent layout from stretching vertically */
                overflow: hidden; /* KEY: keep layout stable */
                padding: 1rem; /* Allow internal visual breathing room */
                box-sizing: border-box;
            }

            .main-text {
                position: absolute;
                inset: 0;
                font-size: 2.5rem;
                line-height: 1.2;
                padding: 0 1rem;
                text-align: center;
                white-space: normal; /* Allow multiline */
                word-break: break-word; /* Break long words if needed */
                overflow-wrap: break-word;
                contain: layout paint;
                will-change: transform, letter-spacing;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .sub-text { padding-top: 0; }
            .nav-button { 
                font-size: 0.8rem;
                padding: 0.8rem;
            }
            #nav-past-works, #nav-press { display: block; }
        }
    </style>
</head>
<body>

    <div class="content-container">
        <div class="main-text-wrapper">
            <p class="main-text" id="main-text-1">As Undefined As</p>
            <p class="main-text" id="main-text-2">As Undefined As</p>
            <p class="main-text" id="main-text-3">As Undefined As</p>
            <p class="main-text" id="main-text-4">As Undefined As</p>
        </div>
    </div>

    <a href="#past-works" id="nav-past-works" class="nav-button">Past Works</a>
    <a href="#publications" id="nav-publications" class="nav-button">Publications</a>
    <a href="#press" id="nav-press" class="nav-button">Press</a>
    <a href="#members" id="nav-members" class="nav-button">Members</a>
    <a href="#writing" id="nav-writing" class="nav-button">Writing</a>
    <a href="#manifesto" id="nav-manifesto" class="nav-button">Manifesto</a>
    <a href="#socials" id="nav-socials" class="nav-button">Socials</a>
    <a href="#contact" id="nav-contact" class="nav-button">Contact</a>

    <script>
        const fontElements = [
            document.getElementById('main-text-1'),
            document.getElementById('main-text-2'),
            document.getElementById('main-text-3'),
            document.getElementById('main-text-4')
        ];
        const FONT_CHANGE_THRESHOLD = 150; 

        let isDragging = false;
        let interactionTimeout;
        let accumulatorX = 0;
        let accumulatorY = 0;
        let dragStartX = 0;
        let dragStartY = 0;
        let lastDirection = 'none';
        const DIRECTION_THRESHOLD = 10;

        function updateDirectionalState(x, y) {
            let dirX = '', dirY = '';
            if (x > DIRECTION_THRESHOLD) dirX = 'right';
            else if (x < -DIRECTION_THRESHOLD) dirX = 'left';
            if (y > DIRECTION_THRESHOLD) dirY = 'down';
            else if (y < -DIRECTION_THRESHOLD) dirY = 'up';
            
            const currentDirection = [dirY, dirX].filter(Boolean).join('-') || 'none';
            
            // Add persistent classes for revealed buttons
            if(dirY) document.documentElement.classList.add(`revealed-${dirY}`);
            if(dirX) document.documentElement.classList.add(`revealed-${dirX}`);
            if(dirY && dirX) document.documentElement.classList.add(`revealed-${dirY}-${dirX}`);

            if (currentDirection !== lastDirection) {
                document.documentElement.setAttribute('data-scroll-direction', currentDirection);
                lastDirection = currentDirection;
            }
        }
        
        function applyDynamicStyles() {
            // --- SCROLL RIGHT: Increase Letter Spacing ---
            const letterSpacing = Math.max(0, accumulatorX * 0.05);

            // --- SCROLL UP: Makes text bigger. SCROLL DOWN: Does not scale. ---
            const scaleValue = accumulatorY < 0 ? 1 + (-accumulatorY * 0.001) : 1;

            // --- SCROLL LEFT: Add skew for italic effect ---
            const skewValue = Math.min(0, Math.max(-88, accumulatorX * 0.15));
            const transform = `scale(${scaleValue}) skewX(${skewValue}deg)`;
            
            // Apply transformations to all layers to keep them in sync
            fontElements.forEach(el => {
                el.style.letterSpacing = `${letterSpacing}px`;
                el.style.transform = transform;
            });

            // --- SCROLL DOWN: Progressively fade in each layer ---
            const scrollProgress = Math.max(0, accumulatorY) / FONT_CHANGE_THRESHOLD;
            const lastFullLayer = Math.floor(scrollProgress);
            const nextLayerFade = scrollProgress - lastFullLayer;
            
            fontElements.forEach((el, index) => {
                if (index <= lastFullLayer) {
                    el.style.opacity = 1;
                } else if (index === lastFullLayer + 1) {
                    el.style.opacity = nextLayerFade;
                } else {
                    el.style.opacity = 0;
                }
            });
        }

        function resetStyles() {
            accumulatorX = 0;
            accumulatorY = 0;
            
            // Only reset the text effects and directional coloring
            const transform = 'scale(1) skewX(0deg)';
            fontElements.forEach((el, index) => {
                el.style.letterSpacing = '';
                el.style.transform = transform;
                el.style.opacity = (index === 0) ? 1 : 0;
            });
            
            document.documentElement.setAttribute('data-scroll-direction', 'none');
            lastDirection = 'none';
        }
        
        function endInteraction() {
            clearTimeout(interactionTimeout);
            // We only reset the text, not the button visibility classes
            interactionTimeout = setTimeout(resetStyles, 300);
        }

        // --- Event Listeners ---
        document.addEventListener('wheel', (e) => {
            if (isDragging) return;
            e.preventDefault();
            clearTimeout(interactionTimeout);
            accumulatorX += e.deltaX;
            accumulatorY += e.deltaY;
            updateDirectionalState(e.deltaX, e.deltaY);
            applyDynamicStyles();
            endInteraction();
        }, { passive: false });

        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            accumulatorX = 0;
            accumulatorY = 0;
            document.body.style.cursor = 'grabbing';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - dragStartX;
            const deltaY = e.clientY - dragStartY;
            accumulatorX = deltaX;
            accumulatorY = deltaY;
            updateDirectionalState(deltaX, deltaY);
            applyDynamicStyles();
        });

        const stopDragging = () => {
            if (isDragging) {
                isDragging = false;
                document.body.style.cursor = 'default';
                endInteraction(); // Call endInteraction to reset text but keep buttons
            }
        };
        document.addEventListener('mouseup', stopDragging);
        document.addEventListener('mouseleave', stopDragging);

        document.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            isDragging = true;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            accumulatorX = 0;
            accumulatorY = 0;
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const touch = e.touches[0];
            const deltaX = touch.clientX - dragStartX;
            const deltaY = touch.clientY - dragStartY;
            accumulatorX = deltaX;
            accumulatorY = deltaY;
            updateDirectionalState(deltaX, deltaY);
            applyDynamicStyles();
        });

        document.addEventListener('touchend', stopDragging);
        document.addEventListener('touchcancel', stopDragging);
        
        // Initial style reset
        resetStyles();
    </script>
</body>
</html>
